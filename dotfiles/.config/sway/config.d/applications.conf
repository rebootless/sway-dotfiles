### Wifi applet
exec_always --no-startup-id sh -c 'pkill -x nm-applet || true; nm-applet --indicator'

### Clipboard manager — CopyQ lives in the tray and handles clipboard history
exec_always --no-startup-id sh -c 'pkill -x copyq || true; copyq'

### Flameshot
#
# Wayland environment + tray
exec_always --no-startup-id sh -c 'pkill -x flameshot || true; sleep 1; env XDG_CURRENT_DESKTOP=sway XDG_SESSION_DESKTOP=sway XDG_SESSION_TYPE=wayland flameshot --tray'
