# Logo key. Use Mod1 for Alt.
# set $mod Mod1
set $mod Mod4

# Home row direction keys, like vim
set $left h
set $down j
set $up k
set $right l

# Your preferred terminal emulator
# set $term foot
set $term kitty

# Your preferred application launcher
# set $menu wmenu-run
set $menu wofi --show drun --allow-images

# Workspace names
set $ws1 1
set $ws2 2
set $ws3 3
set $ws4 4
set $ws5 5
set $ws6 6
set $ws7 7
set $ws8 8
set $ws9 9
set $ws10 10
