### dbus-update-activation-environment
exec_always --no-startup-id dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway

### Polkit
exec_always --no-startup-id lxpolkit

### Waybar
exec_always --no-startup-id sh -c 'pkill -x waybar || true; sleep 2; waybar'

### Notification daemon (SwayNotificationCenter) — the waybar module only
### talks to it via swaync-client; without the daemon running, the
### notification button does nothing.
exec_always --no-startup-id sh -c 'pkill -x swaync || true; swaync'
