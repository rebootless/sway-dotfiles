#
# Wayland
#
linux_display_server wayland

#
# Behavior
#
confirm_os_window_close 0
enable_audio_bell no
mouse_hide_wait 3.0

#
# Appearance
#
background #2E3440
foreground #D8DEE9

cursor #ECEFF4
cursor_text_color #2E3440

selection_background #4C566A
selection_foreground #ECEFF4

#
# Nord palette
#
color0  #3B4252
color1  #BF616A
color2  #A3BE8C
color3  #EBCB8B
color4  #81A1C1
color5  #B48EAD
color6  #88C0D0
color7  #E5E9F0

color8  #4C566A
color9  #BF616A
color10 #A3BE8C
color11 #EBCB8B
color12 #81A1C1
color13 #B48EAD
color14 #8FBCBB
color15 #ECEFF4

#
# Window
#
window_padding_width 6
background_opacity 1.0
hide_window_decorations no

#
# Scrolling
#
scrollback_lines 10000

#
# Font
#
font_family JetBrainsMono Nerd Font
font_size 11.0
